name: Verify Android package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK application ID
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "APK application ID: $ACTUAL"
          test "$ACTUAL" = "wang.lucian.quietcalls.debug"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-debug-apk
          path: app/build/outputs/apk/debug/*.apk
